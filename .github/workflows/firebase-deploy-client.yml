name: Firebase Deploy Client

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Validate deployment secrets
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          for name in FIREBASE_PROJECT FIREBASE_SERVICE_ACCOUNT VITE_API_URL VITE_GOOGLE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Actions secret $name is not configured."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Check Firebase project access
        working-directory: client
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
        run: |
          node <<'NODE'
          const { createRequire } = require("node:module");
          const firebaseRequire = createRequire(require.resolve("firebase-tools/package.json"));
          const { GoogleAuth } = firebaseRequire("google-auth-library");

          async function checkProject() {
            const project = process.env.FIREBASE_PROJECT;
            if (!project || project !== project.trim() || !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(project)) {
              console.error("FIREBASE_PROJECT must be a project ID without quotes, whitespace, or a URL.");
              process.exitCode = 1;
              return;
            }
            const auth = new GoogleAuth({ scopes: ["https://www.googleapis.com/auth/cloud-platform"] });
            const client = await auth.getClient();
            await client.request({
              url: `https://firebase.googleapis.com/v1beta1/projects/${project}`,
              timeout: 30000,
              retry: false,
            });
            console.log("Firebase project access verified.");
          }

          checkProject().catch((error) => {
            const data = error.response?.data;
            const apiError = data?.error;
            console.error(`Firebase project check failed (HTTP ${error.response?.status ?? "no response"}).`);
            // Only report Google's error fields, never request headers or credential objects.
            if (apiError && typeof apiError === "object") {
              console.error(JSON.stringify({ status: apiError.status, message: apiError.message }));
              for (const detail of Array.isArray(apiError.details) ? apiError.details : []) {
                console.error(JSON.stringify({
                  reason: detail.reason,
                  permission: detail.metadata?.permission,
                  service: detail.metadata?.service,
                  consumer: detail.metadata?.consumer,
                }));
              }
            } else if (typeof apiError === "string") {
              console.error(`OAuth error: ${apiError}`);
              if (typeof data.error_description === "string") console.error(data.error_description);
            } else {
              console.error(`Credential/transport error code: ${error.code ?? error.name ?? "unknown"}`);
            }
            process.exitCode = 1;
          });
          NODE

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT" --only hosting --non-interactive
        working-directory: client
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}

      - name: Report deployment URL
        if: success()
        run: |
          echo "Deployed client for project: ${{ secrets.FIREBASE_PROJECT }}"
          echo "If you configured a custom domain, visit your hosting domain to verify the site."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: client

      - name: Run Playwright E2E against deployed site
        env:
          PLAYWRIGHT_BASE_URL: "https://${{ secrets.FIREBASE_PROJECT }}.web.app"
        run: npm run e2e -- --reporter=github
        working-directory: client
